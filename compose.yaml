services:
  comfy-smartgallery:
    image: mmartial/smart-comfyui-gallery:latest
    container_name: comfy-smartgallery
    ports:
      - 8189:8189
    volumes:
      - /comfyui-nvidia/basedir/output:/mnt/output
      - /comfyui-nvidia/basedir/input:/mnt/input
      - /comfyui-nvidia/SmartGallery:/mnt/SmartGallery
#      - /tmp:/deleteto
#      - /etc/localtime:/etc/localtime:ro
      # To use the "Link External Folders" feature, add external locations to be mounted within the container
#      - /path/to/your/ExternalFolder:/mnt/ExternalFolder
      # When using ComfyUI folder structure
#      - /comfyui-nvidia/basedir/model:/ComfyUI-models:ro
      # When using an extra_model_paths.yaml
#      - /StabilityMatrix/Data/Models/Lora:/mnt/loras:ro
#      - /StabilityMatrix/Data/Models/StableDiffusion:/mnt/checkpoints:ro
#      - /StabilityMatrix/Data/Models/DiffusionModels:/mnt/unet:ro
    restart: unless-stopped
    environment:
      - BASE_OUTPUT_PATH=/mnt/output
      - BASE_INPUT_PATH=/mnt/input
      - BASE_SMARTGALLERY_PATH=/mnt/SmartGallery
      # Adapt to wanted values (use id -u and id -g to obtain values)
      - WANTED_UID=1000
      - WANTED_GID=1000
      # Set to true to force chown of the BASE_SMARTGALLERY_PATH folder only
#      - FORCE_CHOWN=true
#      - DELETE_TO=/deleteto
      # Your ComfyUI interface is not accessible on localhost, update to reflect your host's IP
      - COMFYUI_SERVER_URL=http://192.168.100.1:8188
      # Default umask: 0022 (files readable by others); allow override using the UMASK environment variable
#      - UMASK=0077
      # When using ComfyUI folder structure
#      - BASE_MODELS_PATH=/ComfyUI-models
      # When using an extra_model_paths.yaml
#      - LORAS_PATH=/mnt/loras
#      - CHECKPOINTS_PATH=/mnt/checkpoints
#      - UNET_PATH=/mnt/unet
